name: Revisar vencimientos del aula

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh]

permissions:
  contents: write

concurrency:
  group: check-deadlines
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar calendario y notificar
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check_deadlines.py

      - name: Guardar estado de avisos enviados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          if git diff --cached --quiet; then
            echo "Sin cambios en sent.json"
            exit 0
          fi
          git commit -m "chore: actualizar avisos enviados [skip ci]"
          n=0
          until [ $n -ge 3 ]; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              exit 0
            fi
            n=$((n+1))
            echo "Push/rebase falló, reintento $n..."
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "No se pudo hacer push tras reintentos"
          exit 1
